# ============================================================
# いねさば 鉄道路線図データ
# ============================================================
# 編集方法:
#   - stations: に新しい駅を追加
#   - lines: の stations: に駅IDを順番に並べると路線が引かれます
#   - wp:<x>,<y> はウェイポイント（駅ではない経由点）です
#   - gameCoords は Minecraft のゲーム内座標 (x, z) です
# ============================================================

meta:
  title: いねさば 鉄道路線図
  description: ""

# ============================================================
# 路線定義
#   symbol     : ナンバリング用の路線略称記号（例: CW, CE, CK, N）
#   symbolType : ナンバリング枠の形状（square: 四角 / circle: 丸。地下鉄線は circle 推奨）
#   strokeWidth: 線幅px（デフォルト: 6。地下鉄・私鉄等は 4 や 3.5 の細線推奨）
# ============================================================
lines:

  # --- 中央線（西側） ---
  - id: chuo-west
    name: 中央線
    symbol: CW
    color: "#f97316"
    textColor: "#ffffff"
    stations:
      - shiratsuba
      - nishi-shiratsuba
      - semi
      - moeki
      - kururu
      - meikyo
    services:
      - name: 急行
        color: "#e11d48"
        borderColor: "#fecdd3"
        stations:
          - shiratsuba
          - semi
          - meikyo
      - name: 各停
        color: "#2563eb"
        borderColor: "#bfdbfe"
        stations:
          - shiratsuba
          - nishi-shiratsuba
          - semi
          - moeki
          - kururu
          - meikyo

  # --- 中央線（東側） ---
  - id: chuo-east
    name: 中央線
    symbol: CE
    color: "#f97316"
    textColor: "#ffffff"
    stations:
      - shiratsuba
      - centralpark
      - surugaharahonmachi
    services:
      - name: 急行
        color: "#e11d48"
        borderColor: "#fecdd3"
        stations:
          - shiratsuba
      - name: 各停
        color: "#2563eb"
        borderColor: "#bfdbfe"
        stations:
          - shiratsuba
          - centralpark
          - surugaharahonmachi

  # --- 中央環状線 ---
  - id: chuo-kanjyo
    name: 中央環状線
    symbol: CK
    color: "#0284c7"
    textColor: "#ffffff"
    # wp:<x>,<y> はウェイポイント（折れ曲がり点）です
    stations:
      - shiratsuba
      - nishi-shiratsuba
      - semi
      - "wp:-25,0"
      - inematsu
      - "wp:-25,20"
      - sakuragawa
      - "wp:5,20"
      - "wp:5,0"
      - shiratsuba   # 環状なので終点は始発と同じ

  # --- 南北線 ---
  - id: nanboku
    name: 南北線
    symbol: NB
    color: "#0891b2"
    textColor: "#ffffff"
    stations:
      - shiratsuba
      - "wp:-5,0"
      - karigane
      - sakuragawa

  # --- 地下鉄南北線 ---
  - id: sb_nanboku
    name: 地下鉄南北線
    symbol: N
    symbolType: circle
    strokeWidth: 4
    color: "#0021B5"
    textColor: "#ffffff"
    stations:
      - shiratsuba_airport
      - mitakegaoka
      - shiratubasiyakusyo
      - shiratsuba
      - kousekitorihiki

  # --- 白椿BRT ---
  - id: shiratsuba_BRT
    name: 白椿BRT
    symbol: ""
    symbolType: ""
    strokeWidth: 4
    color: "#4A0063"
    textColor: "#000000"
    stations:
      - shiratsuba
      - "wp:-7,0"
      - kyuuginkou
      - modelhouse_mae
# ============================================================
# 駅定義
# ============================================================
# 各項目の説明:
#   id          : 路線から参照するID（半角英数字・ハイフン）
#   name        : 日本語駅名
#   nameEn      : 英語駅名
#   code        : 駅コード（任意、なければ null）
#   x / y       : 路線図上の座標（整数推奨）
#   description : 駅の説明文
#   gameCoords  : ゲーム内座標（x: , z: の形式）、なければ null
#   labelPosition: ラベル位置（top / bottom / left / right）
# ============================================================
